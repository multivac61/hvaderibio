name: Check

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L

  # Layout rules that need a real engine, in phone-sized WebKit.
  browser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: cachix/install-nix-action@v31
      # Only Node comes from the flake: inside the devshell, Nix glibc's ldd
      # cannot see the apt-installed libraries Playwright's WebKit links to.
      - run: |
          node=$(nix build --inputs-from . nixpkgs#nodejs_24 --no-link --print-out-paths)
          echo "$node/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npx tsx tests/fixtures/install.ts
      - run: npm run test:e2e

  # Dispatched checks can be absent from the PR's required-check rollup.
  # Publish the actual test result on the same commit for branch protection.
  dependency-status:
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/automation/nightly-dependencies'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report dependency check result
        run: |
          gh api --method POST "repos/$GH_REPO/statuses/$CHECK_SHA" \
            -f context=check \
            -f state="$CHECK_STATE" \
            -f description="Dependency checks: $CHECK_RESULT" \
            -f target_url="$CHECK_URL"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHECK_SHA: ${{ github.sha }}
          CHECK_RESULT: ${{ needs.check.result }}
          CHECK_STATE: ${{ needs.check.result == 'success' && 'success' || 'failure' }}
          CHECK_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
