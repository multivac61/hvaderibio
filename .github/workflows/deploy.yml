on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *" # Run every hour
name: Deploy
# Deploys race otherwise: an hourly run and a push can overlap, and the one
# that finishes last wins even if it scraped earlier. Queue them instead,
# letting a running deploy finish rather than leaving a half-uploaded site.
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@main
      - uses: cachix/install-nix-action@v31

      - name: 📚 Install dependencies
        run: nix develop -c npm ci

      - name: 🔐 Trust TLS certificate chain for kvikmyndir.is
        run: |
          openssl s_client \
            -connect kvikmyndir.is:443 \
            -servername kvikmyndir.is \
            -showcerts </dev/null 2>/dev/null \
            | awk '/BEGIN CERTIFICATE/,/END CERTIFICATE/' \
            > "$RUNNER_TEMP/kvikmyndir-chain.pem"

          echo "NODE_EXTRA_CA_CERTS=$RUNNER_TEMP/kvikmyndir-chain.pem" >> "$GITHUB_ENV"

      # Booking metadata and encoded posters, so unchanged ones are reused.
      - name: ♻️ Restore scrape cache
        uses: actions/cache/restore@main
        with:
          path: |
            .cache
            static/*.webp
          key: scrape-${{ github.run_id }}
          restore-keys: |
            scrape-

      - name: 🎬 Scrape movie data
        run: nix develop -c npm run scrape

      - name: 💾 Save scrape cache
        uses: actions/cache/save@main
        with:
          path: |
            .cache
            static/*.webp
          key: scrape-${{ github.run_id }}

      - name: ☑️ Check svelte-kit, format and linting
        run: nix develop -c npm run check

      # The scraped catalog is gitignored, so hand it to the package explicitly.
      - name: 🔨 Build for Cloudflare
        run: |
          nix build -L --impure --expr \
            "(builtins.getFlake \"git+file://$PWD\").packages.x86_64-linux.default.override { catalog = $PWD/static; }"

      - name: 🚀 Deploy to Cloudflare Pages
        run: nix develop -c npx wrangler pages deploy result --project-name=hvaderibio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
