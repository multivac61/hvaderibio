name: Update dependencies

on:
  schedule:
    - cron: "23 3 * * *" # Nightly at 03:23 UTC (Iceland time)
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-dependencies
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@main
        with:
          ref: main
      - uses: cachix/install-nix-action@v31
      - uses: oven-sh/setup-bun@main
        with:
          bun-version: latest

      - name: Update Nix inputs
        run: nix flake update

      - name: Update Bun dependencies within their declared ranges
        run: bun update

      - name: Format updated files
        run: |
          nix fmt
          bunx --no-install prettier --write package.json

      # Validate before publishing the update; required PR checks run below too.
      - name: Validate updated dependencies
        run: |
          bun install --frozen-lockfile
          mkdir -p static
          echo '[]' > static/movies.json
          # check runs svelte-kit sync, generating the $lib alias for Bun tests.
          bun run check
          bun test
          bun run build
        env:
          ADAPTER: cloudflare
          NODE_ENV: production

      - uses: peter-evans/create-pull-request@v8
        id: dependencies
        with:
          branch: automation/nightly-dependencies
          delete-branch: true
          add-paths: |
            flake.lock
            package.json
            bun.lock
          commit-message: "deps: keep Nix inputs and Bun dependencies current"
          title: "deps: keep Nix inputs and Bun dependencies current"
          body: |
            Refresh Nix inputs and Bun dependencies nightly to keep the project current.
            Bun dependency updates stay within the ranges declared in package.json.

            Validated with nix fmt, a frozen Bun install, bun test, bun run check,
            and a Cloudflare build before opening this pull request.

      # Explicit dispatch lets GITHUB_TOKEN-created PRs run checks unattended.
      - name: Run required checks on the dependency branch
        if: steps.dependencies.outputs.pull-request-number != ''
        run: gh workflow run check.yml --ref "$PR_BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BRANCH: ${{ steps.dependencies.outputs.pull-request-branch }}

      # GitHub's required checks on main decide when this PR may merge.
      - name: Enable auto-merge for dependency updates
        if: steps.dependencies.outputs.pull-request-number != ''
        run: gh pr merge "$PR_NUMBER" --auto --merge --match-head-commit "$PR_HEAD_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.dependencies.outputs.pull-request-number }}
          PR_HEAD_SHA: ${{ steps.dependencies.outputs.pull-request-head-sha }}
