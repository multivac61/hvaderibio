name: Update dependencies

on:
  schedule:
    - cron: "23 3 * * *" # Nightly at 03:23 UTC (Iceland time)
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-dependencies
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@main
        with:
          ref: main
      - uses: cachix/install-nix-action@v31

      - name: Update Nix inputs
        run: nix flake update

      - name: Update npm dependencies within their declared ranges
        run: nix develop -c npm update

      - name: Format updated files
        run: |
          nix fmt
          nix develop -c npx --no-install prettier --write package.json

      # Validate before publishing the update; required PR checks run below too.
      - name: Validate updated dependencies
        run: nix flake check -L

      - uses: peter-evans/create-pull-request@v8
        id: dependencies
        with:
          branch: automation/nightly-dependencies
          delete-branch: true
          add-paths: |
            flake.lock
            package.json
            package-lock.json
          commit-message: "deps: keep Nix inputs and npm dependencies current"
          title: "deps: keep Nix inputs and npm dependencies current"
          body: |
            Refresh Nix inputs and npm dependencies nightly to keep the project current.
            npm dependency updates stay within the ranges declared in package.json.

            Validated with nix fmt and nix flake check (type checks, lint,
            unit tests and the Cloudflare build) before opening this pull request.

      # Explicit dispatch lets GITHUB_TOKEN-created PRs run checks unattended.
      - name: Run required checks on the dependency branch
        if: steps.dependencies.outputs.pull-request-number != ''
        run: gh workflow run check.yml --ref "$PR_BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BRANCH: ${{ steps.dependencies.outputs.pull-request-branch }}

      # GitHub's required checks on main decide when this PR may merge.
      - name: Enable auto-merge for dependency updates
        if: steps.dependencies.outputs.pull-request-number != ''
        run: gh pr merge "$PR_NUMBER" --auto --merge --match-head-commit "$PR_HEAD_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.dependencies.outputs.pull-request-number }}
          PR_HEAD_SHA: ${{ steps.dependencies.outputs.pull-request-head-sha }}
