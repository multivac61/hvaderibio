<!doctype html>
<html lang="is">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Per-page title, description and canonical URL come from PageMeta. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="is_IS" />
    <meta name="twitter:card" content="summary" />
    <style>
      /* Black until the stars in app.css arrive; the body stays clear so
         they show through. */
      html {
        background: #000;
      }
      html,
      body {
        height: 100%;
        color: #e5e5e5;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: auto !important;
      }
      ::-webkit-scrollbar {
        display: none;
      }
      /* Fathom's 1×1 tracking image lands below <main>. Tucked into the
         corner it cannot make a one-screen page scroll. */
      body > img {
        position: absolute;
        top: 0;
        left: 0;
      }
    </style>
    <script src="https://cdn.usefathom.com/script.js" data-site="GFZYUASY" data-spa="auto" data-canonical="false" defer></script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="text-neutral-200">
    <main class="max-w-9xl mx-auto px-4 pt-2 pb-4 subpixel-antialiased sm:pt-4">%sveltekit.body%</main>
  </body>
</html>
