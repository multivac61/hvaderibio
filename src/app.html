<!doctype html>
<html lang="is">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The site is black throughout. Without a declared scheme Safari falls
         back to a light page wherever it has nothing painted, such as mid-swipe
         between pages, which can turn the URL text black for a moment. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <!-- Per-page title, description and canonical URL come from PageMeta. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="is_IS" />
    <meta name="twitter:card" content="summary" />
    <style>
      html,
      body {
        height: 100%;
        background: #000;
        color: #e5e5e5;
        color-scheme: dark;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: auto !important;
      }
      ::-webkit-scrollbar {
        display: none;
      }
    </style>
    <script src="https://cdn.usefathom.com/script.js" data-site="GFZYUASY" data-spa="auto" data-canonical="false" defer></script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-black text-neutral-200">
    <main class="max-w-9xl mx-auto px-4 pt-2 pb-4 subpixel-antialiased sm:pt-4">%sveltekit.body%</main>
  </body>
</html>
